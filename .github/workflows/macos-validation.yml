name: macOS validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.402
      # The WPF app only runs on Windows; it is compiled here through reference packs (see Directory.Build.props).
      - name: Build solution
        run: dotnet build AkelEtiket.sln -c Release -p:UseSharedCompilation=false
      # Windows spooler/GDI tests are reported as skipped; everything else must pass on macOS.
      # The macOS app's UI tests run headless and save window screenshots as evidence.
      - name: Run tests
        env:
          LABELHARBOR_SCREENSHOTS: ${{ github.workspace }}/macos-results/screenshots
        run: dotnet test AkelEtiket.sln -c Release --no-build --no-restore --logger trx --results-directory macos-results/tests
      # A local, ad hoc signed bundle for trying the app out. It is not notarized and not published.
      - name: Build the macOS app bundle
        run: |
          python3 tools/distribution/build_mac_app.py --output macos-results/app
          rm -rf macos-results/app/LabelHarbor.app
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-validation-${{ github.sha }}
          path: macos-results
          retention-days: 14
